<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostica Campane</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f1ea;color:#2b2b2b}
header{background:#2b2b2b;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header a{color:#f6c76b}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #e5e0d6;border-radius:10px;padding:16px;margin-bottom:16px;overflow-x:auto}
h2{margin:0 0 10px;font-size:1.05rem}
table{border-collapse:collapse;width:100%;font-size:.9rem}
td{padding:5px 8px;border-top:1px solid #eee;vertical-align:top}
td:first-child{color:#777;white-space:nowrap}
button{font:inherit;border:1px solid #e5e0d6;background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer}
</style>
</head>
<body>
<header><b>🔍 Diagnostica</b><a href="/">← Torna</a></header>
<main>
  <p><button onclick="loadAll()">🔄 Aggiorna</button> <button onclick="scanI2C(this)">Scansione I2C</button></p>
  <div class="card"><h2>Sistema</h2><div id="diag">Caricamento...</div></div>
  <div class="card"><h2>Recovery</h2><div id="recovery"></div></div>
  <div class="card"><h2>I2C</h2><div id="i2c" style="color:#777">Premi "Scansione I2C"</div></div>
</main>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(o) {
  if (o === null || typeof o !== 'object') return esc(o);
  if (Array.isArray(o) && o.every(v => typeof v !== 'object')) return esc(o.join(', '));
  return '<table>' + Object.entries(o).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${table(v)}</td></tr>`).join('') + '</table>';
}
async function load(id, url) {
  try { const r = await fetch(url); document.getElementById(id).innerHTML = table(await r.json()); }
  catch (e) { document.getElementById(id).textContent = 'Errore: ' + e.message; }
}
// La scansione la fa la scheda per conto suo: la si avvia e poi si legge il risultato
async function scanI2C(btn) {
  btn.disabled = true; document.getElementById('i2c').textContent = 'Scansione in corso...';
  try { await fetch('/api/i2c-scan?start=1'); } catch (e) {}
  setTimeout(async () => { await load('i2c', '/api/i2c-scan'); btn.disabled = false; }, 2500);
}
async function loadAll() { await load('diag', '/api/diagnostics'); await load('recovery', '/api/recovery-status'); }
loadAll();
</script>
</body>
</html>
